<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta -->
    <title>
        Text formatting sandbox
    </title>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    />

    <!-- Styles -->
    <link
        rel="stylesheet"
        href="./style.css"
    />
</head>

<body>
    <div class="grid">
        <div class="grid__inputs">
            <textarea id="text" spellcheck="false"></textarea>
            <div class="inserts">
                <span class="inserts__label">
                    Insert:
                </span>
                <button onclick="text.value += '&amp;shy;'">Soft-hyphen</button>
                <button onclick="text.value += '&amp;ndash;'">En-dash</button>
                <button onclick="text.value += '&amp;mdash;'">Em-dash</button>
                <button onclick="text.value += '&lt;br\/&gt;'">Break</button>
                <button onclick="text.value += '&amp;nbsp;'">Non-break space</button>
            </div>
        </div>
        <div class="grid__para">
            <p id="para"></p>
        </div>
        <div
            id="controls"
            class="grid__controls"
        ></div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
